version: '3.2'

# Placeholders __FACTORY__ and __ANOMALY_APP_NAME__ are substituted by
# .github/workflows/foundries-deploy.yml before this file is pushed
# into the factory's containers.git.

services:
  __ANOMALY_APP_NAME__:
    image: hub.foundries.io/__FACTORY__/__ANOMALY_APP_NAME__:latest
    restart: always
    devices:
      - "/dev/video0:/dev/video0"
    group_add:
      - video
    environment:
      # Provide on the device — see Foundries device config-set or
      # /var/sota/sota.toml [pacman.compose_apps_env] entries.
      - EI_API_KEY=${EI_API_KEY:-}
      - THRESHOLD=${ANOMALY_THRESHOLD:-5.0}
      - COOLDOWN=${ANOMALY_COOLDOWN:-10}
      - CATEGORY=${ANOMALY_CATEGORY:-training}
      - LABEL=${ANOMALY_LABEL:-anomaly}
      - DEVICE=${ANOMALY_DEVICE:-/dev/video0}
