name: Push to Foundries containers.git

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or ref to deploy (must already exist in this repo)"
        required: true
        default: "v0.1.0"

jobs:
  push-to-factory:
    runs-on: ubuntu-latest
    env:
      FACTORY:          ${{ vars.FOUNDRIES_FACTORY }}
      APP_NAME:         ${{ vars.APP_NAME || 'ei-vision' }}
      ANOMALY_APP_NAME: ${{ vars.ANOMALY_APP_NAME || 'anomaly-watcher' }}
      # Anomaly app is shipped only when EI_ANOMALY_PROJECT_ID is set.
      SYNC_ANOMALY:     ${{ vars.EI_ANOMALY_PROJECT_ID != '' && 'yes' || 'no' }}
    steps:
      - name: Validate config
        run: |
          if [ -z "${FACTORY}" ]; then
            echo "::error::Repo variable FOUNDRIES_FACTORY is not set."; exit 1
          fi
          echo "factory=${FACTORY} app=${APP_NAME} sync_anomaly=${SYNC_ANOMALY} anomaly_app=${ANOMALY_APP_NAME}"

      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Verify app folder exists
        run: |
          test -d "containers/${APP_NAME}" \
            || { echo "containers/${APP_NAME} not found"; exit 1; }
          ls -la "containers/${APP_NAME}"
          if [ "${SYNC_ANOMALY}" = "yes" ]; then
            test -d "containers/${ANOMALY_APP_NAME}" \
              || { echo "EI_ANOMALY_PROJECT_ID is set but containers/${ANOMALY_APP_NAME} is missing"; exit 1; }
            ls -la "containers/${ANOMALY_APP_NAME}"
          fi

      - name: Clone factory containers.git
        env:
          FOUNDRIES_API_TOKEN: ${{ secrets.FOUNDRIES_API_TOKEN }}
        run: |
          if [ -z "${FOUNDRIES_API_TOKEN}" ]; then
            echo "::error::FOUNDRIES_API_TOKEN secret is not set"; exit 1
          fi
          git clone --depth=1 \
            "https://api-token:${FOUNDRIES_API_TOKEN}@source.foundries.io/factories/${FACTORY}/containers.git" \
            factory-containers

      - name: Configure git identity
        working-directory: factory-containers
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync apps into factory repo (with templated compose)
        run: |
          set -euo pipefail

          sync_app() {
            local src=$1 name=$2 app_placeholder=$3
            local dest="factory-containers/${name}"
            rm -rf "${dest}"
            cp -r "${src}" "${dest}"
            if [ -f "${dest}/docker-compose.yml" ]; then
              sed -i \
                -e "s|__FACTORY__|${FACTORY}|g" \
                -e "s|${app_placeholder}|${name}|g" \
                "${dest}/docker-compose.yml"
            fi
          }

          # Main inference app.
          sync_app "containers/${APP_NAME}" "${APP_NAME}" "__APP_NAME__"

          # Anomaly watcher app (only if configured).
          if [ "${SYNC_ANOMALY}" = "yes" ]; then
            sync_app "containers/${ANOMALY_APP_NAME}" "${ANOMALY_APP_NAME}" "__ANOMALY_APP_NAME__"
          fi

      - name: Commit and push if changed
        working-directory: factory-containers
        env:
          TAG_NAME: ${{ github.event.inputs.ref || github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git add "${APP_NAME}"
          [ "${SYNC_ANOMALY}" = "yes" ] && git add "${ANOMALY_APP_NAME}" || true
          if git diff --cached --quiet; then
            echo "No changes to push."
            exit 0
          fi
          git commit -m "sync from ${TAG_NAME} (${SOURCE_SHA})"
          git push origin HEAD:main
